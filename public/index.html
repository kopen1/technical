<!doctype html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TechniKit V0.2</title>
<style>body{font-family:system-ui;max-width:760px;margin:auto;padding:20px;background:#f5f5f5}.card{background:white;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 2px 10px #0001}button,input{padding:12px;margin:5px;border-radius:9px;border:1px solid #ccc}button{cursor:pointer}.option{display:block;width:95%;text-align:left}.muted{color:#666}</style>
</head><body><div id="app"></div><script>
let session=null,step=null;
async function start(){let d=await (await fetch('/api/diagnosis/demo')).json();
session=await (await fetch('/api/diagnosis/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})).json();
step=d.firstStep;render();}
function render(){if(!step){app.innerHTML='<div class="card"><h2>Diagnosis selesai ✓</h2><p>Lakukan verification akhir.</p></div>';return}
let input=step.options?step.options.map(x=>`<button class="option" onclick='send(${JSON.stringify(x)})'>${x}</button>`).join(''):`<input id="v" type="number" step="any" placeholder="Nilai ${step.unit||''}"><button onclick="send(document.getElementById('v').value)">Simpan & Lanjut</button>`;
app.innerHTML=`<div class="card"><p class="muted">TechniKit V0.2 · Diagnostic Session</p><h2>${step.title}</h2><p>${step.instruction}</p>${step.testPoint?'<b>Test Point:</b> '+step.testPoint:''}${step.unit?'<p><b>Unit:</b> '+step.unit+'</p>':''}<hr><p>💡 <b>Mengapa?</b><br>${step.why||''}</p>${input}</div>`}
async function send(value){if(value===''){alert('Masukkan hasil pemeriksaan');return}let d=await (await fetch('/api/diagnosis/step',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session,stepId:step.id,value})})).json();session=d.session;alert('Hasil: '+d.status);step=d.completed?null:d.nextStep;render()}start();
</script></body></html>
