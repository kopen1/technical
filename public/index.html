<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechniKit V1</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#17202a}header{background:#111827;color:white;padding:22px}main{max-width:820px;margin:auto;padding:18px}.card{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}button,select,input{font:inherit;padding:12px;border-radius:10px;border:1px solid #ccd2d8}button{cursor:pointer;background:#111827;color:#fff}.option{display:block;width:100%;text-align:left;margin:8px 0}.muted{color:#65717e}.hidden{display:none}</style></head><body><header><b>🔧 TechniKit V1</b><div>Rule-based Diagnostic Toolkit</div></header><main><div id="home" class="card"><h2>Diagnostic Engine</h2><p class="muted">Pilih kasus untuk pemeriksaan terstruktur.</p><select id="flow"></select> <button onclick="start()">Mulai Diagnosis</button></div><div id="diag" class="hidden"></div></main><script>
let flows=[],s=null,step=null,ev=[];const $=x=>document.getElementById(x);
async function init(){flows=await(await fetch("/api/diagnosis/flows")).json();$("flow").innerHTML=flows.map(f=>`<option value="${f.id}">${f.device} — ${f.symptom}</option>`).join("")}
async function start(){let r=await fetch("/api/diagnosis/session",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({flowId:$("flow").value})});let d=await r.json();s=d.session;step=d.step;ev=[];$("home").classList.add("hidden");$("diag").classList.remove("hidden");render()}
function render(){if(!step){$("diag").innerHTML=`<div class="card"><h2>DONE ✓</h2><h3>Evidence</h3>${ev.map(x=>`<p>• <b>${x.title}</b>: ${x.value} — ${x.status}</p>`).join("")}<button onclick="location.reload()">Kasus Baru</button></div>`;return}let c=step.options?step.options.map(x=>`<button class="option" onclick='send(${JSON.stringify(x)})'>${x}</button>`).join(""):`<input id="v" type="number" step="any" placeholder="Nilai ${step.unit||""}"><button onclick="send(document.getElementById("v").value)">Simpan & Lanjut</button>`;$("diag").innerHTML=`<div class="card"><p class="muted">${s.device}</p><h2>${step.title}</h2><p>${step.instruction}</p>${step.testPoint?`<p><b>Test Point:</b> ${step.testPoint}</p>`:""}${step.unit?`<p><b>Unit:</b> ${step.unit}</p>`:""}<hr><p>💡 <b>Mengapa?</b><br>${step.why}</p>${c}</div>`}
async function send(v){if(String(v).trim()===""){alert("Masukkan hasil pemeriksaan.");return}let r=await fetch("/api/diagnosis/step",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId:s.id,value:String(v)})});let d=await r.json();if(!r.ok){alert(d.error||"Error");return}ev.push({title:step.title,value:v,status:d.status});alert("Evaluasi: "+d.status);step=d.nextStep;render()}init();
</script></body></html>
